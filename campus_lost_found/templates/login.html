{% extends "base.html" %}
{% block title %}Log in — UniTrace{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <a class="auth-mark" href="{{ url_for('home') }}">U</a>
        <span class="eyebrow">WELCOME BACK</span>
        <h1>Log in to UniTrace</h1>
        <p class="auth-subtitle">Your campus community is here to help.</p>
        <form method="post" class="form-stack">
            <label>Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label>
            <label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="Your password"></label>
            <button class="button button-primary button-full" type="submit">Log in</button>
        </form>
        <p class="auth-switch">New to UniTrace? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</section>
{% endblock %}
